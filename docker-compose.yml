services:
  postgres:
    image: postgres:16-alpine
    container_name: ecoflux-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoflux_db}
      POSTGRES_USER: ${POSTGRES_USER:-ecoflux_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoflux_pass}
    volumes:
      - ecoflux_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoflux_user} -d ${POSTGRES_DB:-ecoflux_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ecoflux_pgdata:
    name: ecoflux_pgdata
